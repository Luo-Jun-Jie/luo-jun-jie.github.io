<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – Junjie Luo</title>
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <link rel="icon"
        href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'&gt;&lt;rect width='64' height='64' rx='12' fill='%23000'/&gt;&lt;text x='50%25' y='54%25' font-family='Poppins,Arial,sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle' dominant-baseline='middle'&gt;JL&lt;/text&gt;&lt;/svg&gt;">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
    <link rel="stylesheet" href="/src/styles.css">
    <style>
        .notfound-wrapper {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .notfound-card {
            text-align: center;
            max-width: 480px;
        }

        .notfound-card .code {
            font-size: 4em;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text);
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <div class="header-left">
                <h1 class="name">Junjie Luo</h1>
            </div>
        </div>
    </header>

    <main class="main-wrapper notfound-wrapper">
        <div class="notfound-card block-frame">
            <p class="code">404</p>
            <div class="section-body">
                <p>Sorry, that page doesn't exist.</p>
                <p><a href="/">Back to the homepage</a></p>
            </div>
        </div>
    </main>
</body>

</html>
